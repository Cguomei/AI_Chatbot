{% extends "base.html" %}
{% block title %}管理员登录 - 桌游排行{% endblock %}
{% block content %}

<div style="max-width:360px; margin:60px auto;">
    <div class="card" style="text-align:center;">
        <h2 style="font-size:18px; margin-bottom:16px;">🔐 管理员登录</h2>
        {% if error %}
        <div style="background:#fce4ec; color:#c62828; padding:8px; border-radius:6px; font-size:13px; margin-bottom:12px;">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/api/auth/login">
            <div class="form-group">
                <input class="form-input" type="text" name="username" placeholder="用户名" required>
            </div>
            <div class="form-group">
                <input class="form-input" type="password" name="password" placeholder="密码" required>
            </div>
            <button class="btn btn-primary btn-block" type="submit">登 录</button>
        </form>
        <p style="font-size:11px; color:#999; margin-top:12px;">默认账号 admin / admin123</p>
    </div>
</div>

{% endblock %}
